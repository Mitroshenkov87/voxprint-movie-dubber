# Linux package of VOXPrint AI Movie Dubber: a tar.gz of the program with install.sh (installer/linux/).
# The job packs the tarball, installs it on a GPU-less runner with --skip-gpu-check (CI only), then runs
# `voxprint-movie-dubber --dry-run --json` (installed with --prefix, no root) and checks the JSON: exit 3 (no GPU), the build number and codename
# from BUILD.json, Python 3.14 and torch 2.11.0+cu130. The installer workflow calls this job and publishes the tarball.
name: linux
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Suite rule: clean-install tests run without a Hugging Face token.
      HF_TOKEN: ""
      HUGGINGFACE_HUB_TOKEN: ""
    steps:
      - uses: actions/checkout@v7

      - name: Write the build stamp (build_info.json)
        run: |
          set -euo pipefail
          # Same formula as voxprint_common.buildinfo: GITHUB_RUN_NUMBER + BUILD.json offset.
          python3 - <<'PY'
          import datetime, json, os
          spec = json.load(open("BUILD.json", encoding="utf-8"))
          codename = str(spec.get("codename") or "").strip()
          assert codename, "BUILD.json has no codename"
          build = int(os.environ["GITHUB_RUN_NUMBER"]) + int(spec["offset"])
          if os.environ["GITHUB_REF"].startswith("refs/tags/") and build < 1001:
              raise SystemExit(f"build {build} is below 1001")
          info = {
              "commit": os.environ["GITHUB_SHA"][:7],
              "built": datetime.datetime.now(datetime.UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "run": os.environ["GITHUB_RUN_NUMBER"],
              "build": build,
              "codename": codename,
              "ref": os.environ["GITHUB_REF_NAME"],
              "flavour": "linux tarball",
          }
          open("build_info.json", "w", encoding="utf-8").write(json.dumps(info, indent=2) + "\n")
          print(json.dumps(info, indent=2))
          PY

      - name: Pack the tarball
        run: installer/linux/build-tarball.sh

      - name: Install it (--prefix, no root; --skip-gpu-check, CI only)
        run: |
          set -euo pipefail
          df -h "$HOME" | tail -1
          prefix="${RUNNER_TEMP}/voxprint-ai-suite"
          rm -rf "$prefix"
          # An older per-user install must be removed. User data under ~/.local/share/voxprint stays.
          old="$HOME/.local/share/voxprint-movie-dubber"
          mkdir -p "$old/app" "$HOME/.local/bin" "$HOME/.local/share/applications" "$HOME/.local/share/voxprint/state"
          echo old > "$old/app/main.py"
          printf '#!/bin/sh\n' > "$HOME/.local/bin/voxprint-movie-dubber"
          chmod 755 "$HOME/.local/bin/voxprint-movie-dubber"
          printf '[Desktop Entry]\nType=Application\nName=Voxprint AI Movie Dubber\n' > "$HOME/.local/share/applications/voxprint-movie-dubber.desktop"
          echo keep-user-data > "$HOME/.local/share/voxprint/state/keep.txt"
          mkdir -p /tmp/unpack
          tar -C /tmp/unpack -xzf dist/VoxprintMovieDubber-Linux-x86_64.tar.gz
          /tmp/unpack/VoxprintMovieDubber-Linux-x86_64/install.sh --prefix "$prefix" --skip-gpu-check --skip-models
          echo "VOX_PREFIX=$prefix" >> "$GITHUB_ENV"
          df -h "$HOME" | tail -1

      - name: Check the installation (launcher, CLI, menu entry, .vxdub type)
        run: |
          set -euo pipefail
          prefix="$VOX_PREFIX"
          app="$prefix/movie-dubber"
          d="$HOME/.local/share"
          for f in "$prefix/bin/voxprint-movie-dubber" "$prefix/bin/voxprint-movie-dubber-cli" \
                   "$prefix/share/applications/voxprint-movie-dubber.desktop" \
                   "$prefix/share/mime/packages/voxprint-movie-dubber.xml" \
                   "$prefix/share/icons/hicolor/256x256/apps/voxprint-movie-dubber.png" \
                   "$prefix/share/icons/hicolor/256x256/mimetypes/application-vnd.voxprint.dub+zip.png" \
                   "$app/main.py" "$app/build_info.json" "$app/mdl.json"; do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          test -x "$prefix/bin/voxprint-movie-dubber"
          test -x "$prefix/bin/voxprint-movie-dubber-cli"
          test ! -e "$d/voxprint-movie-dubber"
          test ! -e "$HOME/.local/bin/voxprint-movie-dubber"
          test ! -e "$d/applications/voxprint-movie-dubber.desktop"
          test "$(cat "$d/voxprint/state/keep.txt")" = "keep-user-data"
          grep -q '^Name=VOXPrint AI Movie Dubber$' "$prefix/share/applications/voxprint-movie-dubber.desktop"
          grep -q 'MimeType=application/vnd.voxprint.dub+zip;' "$prefix/share/applications/voxprint-movie-dubber.desktop"
          grep -q 'glob pattern="\*.vxdub"' "$prefix/share/mime/packages/voxprint-movie-dubber.xml"
          if command -v desktop-file-validate >/dev/null; then desktop-file-validate "$prefix/share/applications/voxprint-movie-dubber.desktop"; fi
          shared="$d/voxprint/shared"
          test -f "$shared/manifest.json"
          test -d "$shared/runtimes/py3.14-torch2.11-cu130"
          test -x "$shared/runtimes/py3.14-torch2.11-cu130/env/bin/python"
          test -x "$shared/ffmpeg/n8.1/ffmpeg"
          test -d "$d/voxprint/models"
          test ! -d "$shared/models"
          python3 - "$shared/manifest.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data.get("schema") == 1, data
          comps = data["components"]
          for key in ("python-3.14", "torch-2.11.0-cu130", "ctranslate2-cu12", "ffmpeg-8"):
              row = comps[key]
              for field in ("kind", "version", "path", "sha256", "installed_at", "refs"):
                  assert field in row, (key, field)
              assert "movie-dubber" in row["refs"], (key, row["refs"])
          for key, row in comps.items():
              path = str(row.get("path") or "").rstrip("/")
              assert not path.endswith("/models"), (key, path)
          print("shared layout OK", sorted(comps))
          PY
          echo "installation OK"

      - name: MDL inventory (no download, HF_TOKEN unset)
        run: |
          set -euo pipefail
          test -z "${HF_TOKEN}"
          test -z "${HUGGINGFACE_HUB_TOKEN}"
          py="$HOME/.local/share/voxprint/shared/runtimes/py3.14-torch2.11-cu130/env/bin/python"
          "$py" -m voxprint_common.mdl --json --dry-run plan --manifest "$VOX_PREFIX/movie-dubber/mdl.json" > mdl-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path("mdl-plan.json").read_text(encoding="utf-8").splitlines() if line.strip()]
          last = rows[-1]
          message = str(last.get("message") or "")
          inventory = ("planned" in message or "needs download" in message or message in {"ready", "nothing to download"})
          if last.get("ok") is not True or not inventory:
              raise SystemExit(f"MDL plan failed: {last}")
          print("mdl inventory", last.get("message"))
          PY

      - name: voxprint-movie-dubber --dry-run --json
        run: |
          set -euo pipefail
          code=0
          "$VOX_PREFIX/bin/voxprint-movie-dubber-cli" --version
          "$VOX_PREFIX/bin/voxprint-movie-dubber" --dry-run --json > dry-run.json 2> dry-run.err || code=$?
          echo "exit code: $code"
          cat dry-run.err
          python3 - "$code" <<'PY'
          import json, sys
          code = int(sys.argv[1])
          out = json.load(open("dry-run.json", encoding="utf-8"))
          stamp = json.load(open("build_info.json", encoding="utf-8"))
          print(json.dumps({k: out.get(k) for k in ("ok", "exit_code", "command", "dry_run", "label", "build", "codename", "runtime")}, indent=2))
          print("gpu:", json.dumps(out.get("gpu")))
          problems = []
          def need(cond, what):
              if not cond:
                  problems.append(what)
          for key in ("ok", "exit_code", "command", "dry_run", "version", "label", "build", "codename", "gpu", "models"):
              need(key in out, f"missing key {key}")
          need(out.get("command") == "dry-run" and out.get("dry_run") is True, "not a dry-run object")
          # GitHub runners have no GPU: the documented result is exit 3 with gpu.ok false.
          need(code == 3 and out.get("exit_code") == 3, f"exit code {code} / {out.get('exit_code')}, expected 3 (no GPU)")
          need(out.get("ok") is False and out.get("gpu", {}).get("ok") is False, "gpu.ok should be false on a GPU-less runner")
          need(out.get("build") == stamp["build"], f"build {out.get('build')} != stamp {stamp['build']}")
          need(out.get("codename") == stamp["codename"], f"codename {out.get('codename')} != {stamp['codename']}")
          need(f'build {stamp["build"]} "{stamp["codename"]}"' in str(out.get("label")), f"label {out.get('label')!r}")
          rt = out.get("runtime", {})
          need(str(rt.get("python", "")).startswith("3.14."), f"python {rt.get('python')}")
          need(rt.get("torch") == "2.11.0+cu130", f"torch {rt.get('torch')}")
          need(isinstance(out.get("models"), list) and out["models"], "no models listed")
          if problems:
              raise SystemExit("dry-run JSON check failed:\n- " + "\n- ".join(problems))
          print("dry-run JSON OK")
          PY

      - name: Uninstall
        run: |
          set -euo pipefail
          /tmp/unpack/VoxprintMovieDubber-Linux-x86_64/install.sh --prefix "$VOX_PREFIX" --uninstall
          test ! -e "$VOX_PREFIX/bin/voxprint-movie-dubber"
          test ! -e "$VOX_PREFIX/bin/voxprint-movie-dubber-cli"
          test ! -e "$VOX_PREFIX/movie-dubber"
          test ! -e "$HOME/.local/bin/voxprint-movie-dubber"
          test ! -e "$HOME/.local/share/voxprint-movie-dubber"
          test ! -e "$HOME/.local/share/applications/voxprint-movie-dubber.desktop"
          shared="$HOME/.local/share/voxprint/shared"
          test ! -d "$shared/runtimes/py3.14-torch2.11-cu130"
          test ! -d "$shared/ffmpeg/n8.1"
          test ! -d "$shared/models"
          test ! -d "$HOME/.local/share/voxprint/models"
          test ! -f "$shared/manifest.json"
          echo "uninstall OK"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: VoxprintMovieDubber-Linux-x86_64
          path: |
            dist/VoxprintMovieDubber-Linux-x86_64.tar.gz
            dist/VoxprintMovieDubber-Linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
