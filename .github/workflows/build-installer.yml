# Builds both installers of Voxprint AI Movie Dubber on free GitHub-hosted Windows runners (no secrets are used):
#   online: the small installer that downloads Python, PyTorch and the dependencies during setup;
#   full:   the offline installer that carries them (installer/make-full-payload.ps1), split into parts below 2 GB.
# Each one is installed silently, the installed program is checked and tested, then uninstalled; the installers are kept
# as workflow artifacts. A pushed tag "v*" additionally publishes both on one pre-release, with their SHA-256 in the notes.
# Runners have no GPU: /TORCH=cpu (online) and /SKIPGPUGATE=1 (full, keeps its cu130 build) are CI-only switches.
# VOXPRINT_SKIP_GPU_GATE lets the window self-test open on that same runner.
# The audit job runs first. The installer is not built when ruff, mypy, bandit (high), gitleaks, or an
# un-allowlisted pip-audit high/critical finding fails that job. Vulture and radon do not fail it.
name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  audit:
    uses: ./.github/workflows/audit.yml
  installer:
    needs: audit
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [online, full]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      VOXPRINT_SKIP_GPU_GATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Check the release tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "not a release tag: '$tag' (expected v<major>.<minor>.<patch>[-label])" }
          $ver = (Select-String -Path dubber\appinfo.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (-not $tag.StartsWith("v$ver")) { throw "tag $tag does not match APP_VERSION $ver" }
          "release tag: $tag (APP_VERSION $ver)"

      - name: Write the build stamp (build_info.json)
        shell: pwsh
        run: |
          # Same formula as dubber.appinfo.resolve_build: GITHUB_RUN_NUMBER + BUILD.json offset.
          $spec = Get-Content -Raw -Encoding utf8 BUILD.json | ConvertFrom-Json
          $offset = [int]$spec.offset
          $codename = [string]$spec.codename
          if (-not $codename) { throw "BUILD.json has no codename" }
          $runText = "${{ github.run_number }}"
          if ($runText -notmatch '^\d+$') { throw "GITHUB_RUN_NUMBER is not a number: $runText" }
          $build = [int]$runText + $offset
          if ($build -lt 1001) { throw "build $build is below 1001 (run $runText + offset $offset)" }
          $info = [ordered]@{
            commit = "${{ github.sha }}".Substring(0, 7)
            built = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            run = $runText
            build = $build
            codename = $codename
            ref = "${{ github.ref_name }}"
            flavour = "${{ matrix.kind }} installer"
          }
          [IO.File]::WriteAllText("$PWD\build_info.json", (($info | ConvertTo-Json) + "`n"), (New-Object Text.UTF8Encoding $false))
          Get-Content build_info.json
          "build number: $build ($codename)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - uses: actions/setup-python@v7
        if: matrix.kind == 'full'
        with:
          python-version: "3.14"

      - name: Build the full installer's payload (uv, Python 3.14, wheels incl. PyTorch 2.11.0+cu130, ffmpeg)
        if: matrix.kind == 'full'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="free GB";e={[math]::Round($_.Free/1GB,1)}}
          & installer\make-full-payload.ps1 -Out build\payload -Requirements requirements.txt -Constraints installer\runtime-constraints.txt `
              -Lock dubber\infra\runtime_lock.json -Python (Get-Command python).Source -Flavor cu130

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if ("${{ matrix.kind }}" -eq "full") {
            & $iscc /DFull installer\VoxprintMovieDubber.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
            $parts = @(Get-ChildItem installer\Output -File | Where-Object { $_.Name -like "VoxprintMovieDubber-Full-Setup*" } | Sort-Object Name)
            $sums = @()
            foreach ($f in $parts) {
              "{0}: {1:N2} MB" -f $f.Name, ($f.Length / 1MB)
              if ($f.Length -ge 2000000000) { throw "$($f.Name) is over the 2 GB GitHub release asset limit" }
              $sums += "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)"
            }
            if ($parts.Count -lt 2) { throw "expected the setup .exe and at least one .bin part" }
            $sums | Out-File -Encoding ascii installer\Output\VoxprintMovieDubber-Full-Setup.sha256
            Remove-Item build\payload -Recurse -Force          # disk space for the install test
          } else {
            & $iscc installer\VoxprintMovieDubber.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
            $setup = Get-Item installer\Output\VoxprintMovieDubber-Setup.exe
            "installer size: {0:N2} MB" -f ($setup.Length / 1MB)
            if ($setup.Length -gt 50MB) { throw "the online installer must stay small" }
            $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
            "$h  VoxprintMovieDubber-Setup.exe" | Out-File -Encoding ascii installer\Output\VoxprintMovieDubber-Setup.exe.sha256
          }
          Get-Content installer\Output\*.sha256

      - name: Silent install (online - CPU PyTorch build downloaded; full - cu130 runtime from the installer, no download)
        shell: pwsh
        run: |
          if ("${{ matrix.kind }}" -eq "full") {
            $setup = (Resolve-Path installer\Output\VoxprintMovieDubber-Full-Setup.exe).Path
            $ci = "/SKIPGPUGATE=1"
          } else {
            $setup = (Resolve-Path installer\Output\VoxprintMovieDubber-Setup.exe).Path
            $ci = "/TORCH=cpu"
          }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\vmd",$ci,'/TASKS=""',"/LOG=C:\vmd-install.log" -Wait -PassThru
          "install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            if (Test-Path C:\vmd-install.log) { Get-Content C:\vmd-install.log -Tail 80 }
            if (Test-Path "$env:TEMP\VoxprintMovieDubber-setup.log") { Get-Content "$env:TEMP\VoxprintMovieDubber-setup.log" -Tail 120 }
            throw "install failed"
          }

      - name: Check the installation (files, Start menu, Apps and features)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in "main.py", "runtime\Scripts\pythonw.exe", "runtime\Scripts\python.exe", "unins000.exe", "assets\voxprint-dubber.ico", "dubber\appinfo.py") {
            if (-not (Test-Path "C:\vmd\$f")) { throw "missing after install: $f" }
          }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Voxprint" -Filter "*.lnk" | Where-Object { $_.Name -like "*Voxprint AI Movie Dubber*" }
          $menu | ForEach-Object { "start menu: " + $_.FullName }
          if (-not ($menu | Where-Object { $_.Name -eq "Voxprint AI Movie Dubber.lnk" })) { throw "no Start menu shortcut in the shared Voxprint folder" }
          if (-not ($menu | Where-Object { $_.Name -eq "Voxprint AI Movie Dubber - diagnostics.lnk" })) { throw "no diagnostics shortcut" }
          # the runtime: a junction to the shared, version-keyed LOCALAPPDATA\Voxprint\runtime-<key>, with our key in its users file
          $link = Get-Item C:\vmd\runtime -Force
          if (-not ($link.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw "C:\vmd\runtime is not a link to the shared runtime" }
          $rt = Get-ChildItem "$env:LOCALAPPDATA\Voxprint" -Directory -Filter "runtime-*" | Where-Object { Test-Path "$($_.FullName)\runtime-key.json" } | Select-Object -First 1
          if (-not $rt) { throw "no shared runtime-<key> folder" }
          "runtime: " + $rt.FullName + " " + (Get-Content "$($rt.FullName)\runtime-key.json" -Raw)
          if (-not ((Get-Content "$($rt.FullName)\.users.json" -Raw | ConvertFrom-Json).'movie-dubber')) { throw "movie-dubber is not registered in the runtime users file" }
          & C:\vmd\runtime\Scripts\python.exe -c "import torch; print('torch', torch.__version__); assert torch.__version__.startswith('2.11.0')"
          if ($LASTEXITCODE -ne 0) { throw "the runtime does not have the pinned PyTorch 2.11.0" }
          if ("${{ matrix.kind }}" -eq "full") {
            & C:\vmd\runtime\Scripts\python.exe -c "import torch; print('torch', torch.__version__); assert torch.__version__.endswith('+cu130')"
            if ($LASTEXITCODE -ne 0) { throw "the full installer did not install the cu130 build" }
            if (Select-String -Path "$env:TEMP\VoxprintMovieDubber-setup.log" -Pattern "Downloading uv|Downloading ffmpeg" -Quiet) { throw "the full installer downloaded components" }
          }
          $suite = "$env:LOCALAPPDATA\Voxprint\state\suite.json"
          if (-not (Test-Path $suite)) { throw "suite.json was not written" }
          "suite.json: " + (Get-Content $suite -Raw)
          $sh = New-Object -ComObject WScript.Shell
          $lnk = $sh.CreateShortcut(($menu | Where-Object { $_.Name -eq "Voxprint AI Movie Dubber.lnk" }).FullName)
          "shortcut target: $($lnk.TargetPath) $($lnk.Arguments)"
          if (-not (Test-Path $lnk.TargetPath)) { throw "shortcut target does not exist" }
          $reg = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "Voxprint AI Movie Dubber*" }
          if (-not $reg) { throw "no Apps and features entry" }
          "apps and features: $($reg.DisplayName) $($reg.DisplayVersion)"
          if (-not (Test-Path C:\vmd\build_info.json)) { throw "build_info.json was not installed" }
          $users = "$env:LOCALAPPDATA\Voxprint\models\.users.json"
          if (-not (Test-Path $users)) { throw "the shared models users file was not created: $users" }
          "models users: " + (Get-Content $users -Raw)
          if (-not ((Get-Content $users -Raw | ConvertFrom-Json).'movie-dubber')) { throw "movie-dubber is not registered in $users" }
          "installed size: {0:N0} MB" -f ((Get-ChildItem C:\vmd -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - name: Run the installed program (version, window self-test, test suite)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VOXPRINT_DUBBER_HOME = "C:\vmd-data"
          $env:VOXPRINT_DESKTOP = "C:\vmd-desktop"
          New-Item -ItemType Directory -Force C:\vmd-desktop | Out-Null
          $py = "C:\vmd\runtime\Scripts\python.exe"
          & $py C:\vmd\main.py --version; if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          & $py -c "import PySide6, os, glob; d = os.path.dirname(PySide6.__file__); print('Qt FFmpeg:', [os.path.basename(f) for f in glob.glob(os.path.join(d, 'av*.dll'))]); assert glob.glob(os.path.join(d, 'plugins', 'multimedia', 'ffmpegmediaplugin.dll'))"
          if ($LASTEXITCODE -ne 0) { throw "Qt Multimedia FFmpeg backend missing" }
          & $py C:\vmd\main.py --selftest; if ($LASTEXITCODE -ne 0) { throw "window self-test failed" }
          & C:\vmd\tools\uv\uv.exe pip install --python $py pytest; if ($LASTEXITCODE -ne 0) { throw "pytest install failed" }
          & $py -m pytest tests -p no:cacheprovider; if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Download a small model with the installer's own command
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VOXPRINT_DUBBER_HOME = "C:\vmd-data"
          & C:\vmd\runtime\Scripts\python.exe C:\vmd\main.py --fetch-models --models sep
          if ($LASTEXITCODE -ne 0) { throw "model download failed" }

      - name: Diagnostics on the runner (CPU, short run); the report is kept as an artifact
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-report | Out-Null
          $env:VOXPRINT_DESKTOP = "$PWD\ci-report"
          $env:VOXPRINT_DUBBER_HOME = "C:\vmd-data"
          & C:\vmd\runtime\Scripts\python.exe C:\vmd\main.py --diagnose-cli --quick --asr-repo Systran/faster-whisper-tiny

      - name: Uninstall (silent) and check that nothing is left
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # no -Wait: the uninstaller starts a temporary copy of itself and Start-Process would wait for the whole tree
          Start-Process C:\vmd\unins000.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=C:\vmd-uninstall.log" | Out-Null
          for ($i = 0; $i -lt 90 -and (Test-Path C:\vmd); $i++) { Start-Sleep 2 }
          if (Test-Path C:\vmd) {
            if (Test-Path C:\vmd-uninstall.log) { Get-Content C:\vmd-uninstall.log -Tail 40 }
            Get-ChildItem C:\vmd | Select-Object -First 20 | Format-Table Name
            throw "the installation folder is still there after the uninstall"
          }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "*.lnk" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*Voxprint AI Movie Dubber*" }
          if ($menu) { throw "Start menu shortcuts are still there" }
          $reg = Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "Voxprint AI Movie Dubber*" }
          if ($reg) { throw "the Apps and features entry is still there" }
          $users = "$env:LOCALAPPDATA\Voxprint\models\.users.json"
          if ((Test-Path $users) -and ((Get-Content $users -Raw | ConvertFrom-Json).'movie-dubber')) { throw "movie-dubber is still registered in $users" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Voxprint\models")) { throw "the shared models were deleted without asking" }
          # the uninstaller deletes the shared runtime (several GB) in its last step, after the program folder is gone: wait for it
          for ($i = 0; $i -lt 120; $i++) {
            $left = Get-ChildItem "$env:LOCALAPPDATA\Voxprint" -Directory -Filter "runtime-*" -ErrorAction SilentlyContinue
            if (-not $left) { break }
            Start-Sleep 2
          }
          if ($left) {
            if (Test-Path C:\vmd-uninstall.log) { Get-Content C:\vmd-uninstall.log | Select-String "runtime" }
            foreach ($d in $left) { $d.FullName; Get-ChildItem $d.FullName | Format-Table Name; if (Test-Path "$($d.FullName)\.users.json") { Get-Content "$($d.FullName)\.users.json" } }
            throw "the unused shared runtime was not removed"
          }
          "models kept: " + ((Get-ChildItem "$env:LOCALAPPDATA\Voxprint\models" -Directory | ForEach-Object Name) -join ", ")
          "uninstall OK"

      - name: Setup logs
        if: always()
        shell: pwsh
        run: |
          foreach ($l in "C:\vmd-install.log", "$env:TEMP\VoxprintMovieDubber-setup.log", "C:\vmd-uninstall.log") {
            if (Test-Path $l) { "== $l"; Get-Content $l -Tail 60 }
          }
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          foreach ($l in "C:\vmd-install.log", "$env:TEMP\VoxprintMovieDubber-setup.log", "C:\vmd-uninstall.log") { if (Test-Path $l) { Copy-Item $l ci-logs } }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.kind == 'full' && 'VoxprintMovieDubber-Full-Setup' || 'VoxprintMovieDubber-Setup' }}
          path: |
            installer/Output/*.exe
            installer/Output/*.bin
            installer/Output/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ matrix.kind == 'full' && 7 || 30 }}

      - name: Upload the diagnostics report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-and-logs-${{ matrix.kind }}
          path: |
            ci-report/*.txt
            ci-logs/*
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the pre-release (both installers, SHA-256 in the notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ls -l dist
          notes="docs/release-notes/$tag.md"
          if [ ! -f "$notes" ]; then
            echo "Pre-release of Voxprint AI Movie Dubber. Windows 11 24H2 or newer; NVIDIA GeForce RTX 40-series or newer with a 600+ driver." > /tmp/notes.md
          else
            cp "$notes" /tmp/notes.md
          fi
          sed -i 's/\r$//' dist/*.sha256            # written by PowerShell with CRLF
          (cd dist && sha256sum -c *.sha256)
          {
            printf '\n\n## Files and SHA-256\n\n| File | Size | SHA-256 |\n| --- | --- | --- |\n'
            for f in $(cd dist && ls *.exe *.bin | sort); do
              printf '| `%s` | %s bytes | `%s` |\n' "$f" "$(stat -c %s "dist/$f")" "$(sha256sum "dist/$f" | cut -d' ' -f1)"
            done
            printf '\nBuilt from commit %s (workflow run %s).\n' "${{ github.sha }}" "${{ github.run_number }}"
          } >> /tmp/notes.md
          title=$(python3 -c "from dubber.appinfo import app_build, release_title; n=app_build(); assert isinstance(n, int) and n >= 1001, n; print(release_title())")
          echo "release title: $title"
          test -n "$title"
          gh release create "$tag" --prerelease --title "$title" --verify-tag --notes-file /tmp/notes.md dist/*.exe dist/*.bin dist/*.sha256
