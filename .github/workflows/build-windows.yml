# LOCAL DRAFT - not pushed anywhere.  Copy to the repository's .github/workflows/ once a repo exists (a private repo is fine).
# Builds on a clean Windows runner: tests (CPU), a CPU diagnostics run on the bundled clip (the report is uploaded as an artifact),
# the portable zip and (optionally) the PyInstaller folder + Inno Setup installer.  Manual trigger or a "v*" tag.
# NOTE: GitHub runners have no NVIDIA GPU, so GPU/CUDA-Graphs results can only come from the user's laptop.
name: build-windows
on:
  workflow_dispatch:
    inputs:
      build_exe:
        description: "Also build the PyInstaller folder + Inno Setup installer (slow, big)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      VOXPRINT_DESKTOP: ${{ github.workspace }}\ci-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tools
        shell: pwsh
        run: python -m pip install --quiet -U pip uv
      - name: PyTorch (CPU build - the runner has no GPU)
        shell: pwsh
        run: uv pip install --system torch torchaudio --torch-backend=cpu
      - name: Dependencies
        shell: pwsh
        run: uv pip install --system -r requirements-dev.txt
      - name: Tests
        shell: pwsh
        run: python -m pytest -q
      - name: GUI self-test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --selftest
      - name: Diagnostics on the bundled clip (CPU, quick)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-desktop | Out-Null
          python main.py --diagnose-cli --quick --asr-repo Systran/faster-whisper-tiny
        continue-on-error: true
      - name: Portable bundle
        shell: pwsh
        run: python tools/make_portable_zip.py
      - name: PyInstaller + Inno Setup
        if: ${{ github.event.inputs.build_exe == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          pyinstaller --onedir --windowed --noconfirm --clean --name VoxprintMovieDubber --paths . `
            --add-data "dubber\locales;dubber\locales" --add-data "assets;assets" `
            --collect-all qwen_tts --collect-all faster_qwen3_tts --collect-all faster_whisper --collect-all silero_vad `
            --collect-all imageio_ffmpeg --collect-all sentencepiece --collect-all certifi --collect-data librosa `
            --copy-metadata transformers --copy-metadata tokenizers --copy-metadata huggingface_hub --copy-metadata safetensors `
            --copy-metadata accelerate --copy-metadata torch --copy-metadata numpy --copy-metadata tqdm --copy-metadata regex `
            --copy-metadata requests --copy-metadata packaging --copy-metadata filelock --copy-metadata qwen-tts-hf --copy-metadata faster-qwen3-tts `
            --hidden-import dubber.workers.w_gpu --hidden-import dubber.workers.w_vad --hidden-import dubber.workers.w_sep `
            --hidden-import dubber.workers.w_asr --hidden-import dubber.workers.w_diar --hidden-import dubber.workers.w_mt `
            --hidden-import dubber.workers.w_tts --hidden-import dubber.workers.w_fetch `
            --exclude-module gradio --exclude-module tkinter --exclude-module matplotlib main.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VoxprintMovieDubber.iss
      - uses: actions/upload-artifact@v4
        with:
          name: voxprint-movie-dubber-windows
          path: |
            dist/*.zip
            installer/Output/*.exe
            ci-desktop/*.txt
          if-no-files-found: warn
