# Code audit (tools/audit.py): ruff (pyflakes, syntax, public docstrings), mypy, bandit, pip-audit, vulture, radon, gitleaks.
# One summary in the job summary; the full text is the audit-report artifact.
# Push and pull request scan new commits with gitleaks. A weekly schedule, a manual run, and a
# call from the installer workflow scan the whole history. Vulture and radon never fail the job.
name: audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install gitleaks
        run: |
          ver=8.30.1
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Choose the gitleaks scan
        id: leaks
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "schedule" ] || [ "$event" = "workflow_dispatch" ] || [ "$event" = "workflow_call" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "range=" >> "$GITHUB_OUTPUT"
          elif [ "$event" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "range=" >> "$GITHUB_OUTPUT"
            else
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "range=${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: App environment (CPU PyTorch) and audit tools
        run: |
          python -m pip install -q uv
          uv venv .app
          uv venv .tools
          uv pip install --python .app/bin/python torch==2.11.0 torchaudio==2.11.0 torchcodec==0.17.0 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .app/bin/python -r requirements.txt -c installer/runtime-constraints.txt
          uv pip install --python .tools/bin/python -r tools/requirements-audit.txt
      - name: Audit
        run: |
          .tools/bin/python tools/audit.py \
            --python .app/bin/python \
            --gitleaks-mode "${{ steps.leaks.outputs.mode }}" \
            --gitleaks-range "${{ steps.leaks.outputs.range }}"
      - name: Headless CLI dry-run
        shell: bash
        run: |
          set -eu
          set +e
          .app/bin/python main.py --dry-run --json > /tmp/voxprint-dry-run.json 2> /tmp/voxprint-dry-run.err
          code=$?
          set -e
          echo "stderr:"
          cat /tmp/voxprint-dry-run.err
          DRY_CODE="$code" .app/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          code = int(os.environ["DRY_CODE"])
          raw = Path("/tmp/voxprint-dry-run.json").read_text(encoding="utf-8")
          err = Path("/tmp/voxprint-dry-run.err").read_text(encoding="utf-8")
          decoder = json.JSONDecoder()
          data, end = decoder.raw_decode(raw.strip())
          if raw.strip()[end:].strip():
              raise SystemExit("stdout has more than one JSON value")
          if not isinstance(data, dict):
              raise SystemExit("stdout is not a JSON object")
          if "Traceback" in err:
              raise SystemExit("dry-run crashed")
          for key in ("ok", "exit_code", "command", "dry_run", "label", "build", "codename", "runtime", "gpu", "models", "would_run"):
              if key not in data:
                  raise SystemExit(f"missing {key}")
          if data["dry_run"] is not True or data["command"] != "dry-run":
              raise SystemExit("not a dry-run result")
          if data["exit_code"] != code or data["ok"] is not (code == 0):
              raise SystemExit(f"exit_code {data['exit_code']} does not match process {code}")
          spec = json.loads(Path("BUILD.json").read_text(encoding="utf-8"))
          run = os.environ.get("GITHUB_RUN_NUMBER", "").strip()
          expected = int(run) + int(spec["offset"]) if run.isdigit() else int(spec["offset"])
          if data["build"] != expected or data["codename"] != spec["codename"]:
              raise SystemExit(f"build {data['build']!r} {data['codename']!r}, expected {expected} {spec['codename']!r}")
          gpu = data["gpu"]
          if gpu.get("ok") is not False or gpu.get("code") not in ("no_cuda", "low_compute") or code != 3:
              raise SystemExit(f"Linux runner should report an unsupported GPU, got {code} {gpu}")
          if not isinstance(data["models"], list) or not data["models"]:
              raise SystemExit("models missing from discovery")
          if not isinstance(data["would_run"], dict) or "stages" not in data["would_run"]:
              raise SystemExit("would_run missing")
          print("dry-run ok", code, data["label"], gpu["code"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report
          path: audit-report.txt
          retention-days: 14
