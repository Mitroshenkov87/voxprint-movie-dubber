# Documentation site. Pull requests and pushes build with mkdocs --strict.
# A push to main also publishes the site with GitHub Pages.
name: docs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Command-line reference is generated
        run: python tools/gen_cli_docs.py --check
      - name: Build the site
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          QT_QPA_PLATFORM: offscreen
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
