# Non-strict baseline for the release audit (tools/audit.py).
# Unannotated functions are not required to be typed. There is no global
# ignore_errors and no per-module ignore of our own packages.
# ignore_missing_imports covers third-party libraries that ship no stubs
# (torch, PySide6, and the rest of the scientific stack).

[mypy]
python_version = 3.11
files = dubber, main.py, tools
exclude = (?x)(
    third_party/
    | ^\.venv/
    | ^\.app/
    | ^\.tools/
  )
ignore_missing_imports = True
follow_imports = silent
namespace_packages = True
explicit_package_bases = True
show_error_codes = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
pretty = False
